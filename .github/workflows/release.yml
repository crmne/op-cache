name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    if: "!contains(github.ref_name, '-')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install packaging CLI
        run: gem install native-packages --version 0.2.0 --no-document
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Validate tag and test
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          native-packages check-version "$VERSION"
          cargo test --locked --manifest-path Cargo.toml
      - name: Build release binary
        run: cargo build --locked --release --manifest-path Cargo.toml --target ${{ matrix.target }}
      - name: Archive release payload
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          name="op-cache-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/op-cache" README.md LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Publish binary archives
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum *.tar.gz > checksums.txt)
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* --verify-tag --generate-notes
          fi

  packaging:
    needs: release
    uses: ./.github/workflows/packaging.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
